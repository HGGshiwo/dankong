# ==========================================
# 1. 状态指示器配置 (StatusConfig)
# 对应 config_type: "state"
# ==========================================
state_bool:
  - key: connected
    name: "飞控连接"
    collapse: false
    
  - key: arm
    name: "解锁"
    collapse: false
    
  - key: planner
    name: "避障"
    collapse: false
 
  - key: detect_type
    name: "检测"
    collapse: false

  - key: pland
    name: "精准降落"
    collapse: false
  
  - key: recording
    name: "录制"
    collapse: false

state_value:
  - key: mode
    name: "飞控模式"
    collapse: false
  
  - key: state
    name: "单控模式"
    collapse: false

state:
  - key: gps_nsats
    name: "GPS星数"
    collapse: false
  
  - key: gps_fix_type
    name: "GPS fix_type"
    collapse: false
  
  - key: rel_alt
    name: "相对高度"
    collapse: false
    fixed: 2
  
  - key: dist
    name: "目标距离"
    collapse: false
    fixed: 2
  
  - key: version
    name: "version"
    collapse: false
  
  - key: basic_state
    name: "基本状态"
    collapse: false
  
  - key: battery_level
    name: "电量"
    collapse: false
  
  - key: yaw_diff
    name: "偏航误差"
    collapse: true
  
  - key: yr
    name: "期望角速"
    collapse: true
  
  - key: vx
    name: "期望速度"
    collapse: true
  
  - key: alt_diff
    name: "高度误差"
    collapse: true
  
  - key: wp_idx
    name: "当前航点"
    collapse: true
  
